name: Build Airflow image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR (publishing branches only)
        type: boolean
        required: true
        default: false
  push:
    branches: [main, v2, codex/airflow-container-image]
    paths:
      - docker/**
      - airflow/requirements*.txt
      - .github/workflows/airflow-image.yml
  pull_request:
    branches: [main, v2]
    paths:
      - docker/**
      - airflow/requirements*.txt
      - .github/workflows/airflow-image.yml

concurrency:
  group: airflow-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Select image name and publication mode
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          image="ghcr.io/${OWNER,,}/radiofrance-airflow"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$BRANCH" == main || "$BRANCH" == v2 || "$BRANCH" == codex/airflow-container-image ]]; then
            if [[ "$EVENT" == push || ( "$EVENT" == workflow_dispatch && "$REQUEST_PUBLISH" == true ) ]]; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and run embedded smoke checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/airflow/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: radiofrance-airflow:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Radio France Airflow dependency environment
          cache-from: type=gha,scope=airflow-image
          cache-to: type=gha,mode=max,scope=airflow-image
      - name: Verify the runnable image and record its size
        run: |
          docker run --rm --entrypoint bash radiofrance-airflow:test /opt/radiofrance/smoke-test.sh
          bytes=$(docker image inspect radiofrance-airflow:test --format '{{.Size}}')
          {
            echo "Image: ${{ steps.image.outputs.name }}:${GITHUB_SHA}"
            echo
            echo "Local image size: $bytes bytes (uncompressed; shared layers included)."
            echo
            echo "Publish to GHCR: ${{ steps.image.outputs.publish }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Measure image footprint
        run: bash docker/measure-image.sh radiofrance-airflow:test | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          docker tag radiofrance-airflow:test "$IMAGE:$GITHUB_SHA"
          tag="${BRANCH//\//-}"
          docker tag radiofrance-airflow:test "$IMAGE:$tag"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$tag"
