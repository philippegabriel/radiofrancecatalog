name: Build and deploy

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: radiofrance-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pgabriel
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: template1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgabriel -d template1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests

      - name: Build
        shell: bash
        env:
          OPENAPIKEY: ${{ secrets.OPENAPIKEY }}
        run: |
          make KEY=$OPENAPIKEY

      - name: Prepare site
        run: |
          mkdir -p site
          cp *.html site/
          cp *.csv site/
          cp index.css site/
          cp *.webp site/

      - name: Check site contents
        run: |
          ls -la site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5