name: Code validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  AIRFLOW_HOME: /tmp/radiofrance-ci-airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # Compose validation only: no repository credentials or model cache are needed.
  AIRFLOW_UI_PASSWORD: ci-only-password
  RF_PROJECT_ROOT: ${{ github.workspace }}

jobs:
  analysis:
    name: Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            ci/requirements.txt
            airflow/requirements.txt
            download/requirements.txt
            embedding/requirements.txt
            .github/workflows/code-validation.yml
      - name: Install analysis dependencies
        run: |
          python -m venv venv/airflow
          venv/airflow/bin/python -m pip install -r ci/requirements.txt
          # Keep model-library dependencies separate, matching pyrightconfig.json.
          python -m venv venv/radiofrance
          venv/radiofrance/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu torchvision==0.29.1+cpu
          venv/radiofrance/bin/python -m pip install -r embedding/requirements.txt
      - name: Type check
        run: venv/airflow/bin/pyright
      - name: Validate Compose configuration
        run: docker compose --profile jobs config --quiet
      - name: Check shell syntax
        run: |
          for script in airflow/configure ci/run-tests database/test/test-setup database/test/test-loader; do
            bash -n "$script"
          done
      - name: Parse maintained DAGs
        run: venv/airflow/bin/python ci/check_dags.py

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PG_BINDIR: /usr/lib/postgresql/17/bin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            ci/requirements.txt
            airflow/requirements.txt
            download/requirements.txt
      - name: Install test dependencies
        run: |
          python -m venv venv/airflow
          venv/airflow/bin/python -m pip install -r ci/requirements.txt
      - name: Install PostgreSQL 17 and pgvector
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-17-pgvector
      - name: Run maintained test suites
        run: bash ci/run-tests
